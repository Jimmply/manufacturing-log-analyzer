name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install core deps
        # Only the libraries the test suite actually touches.
        # Heavier optional deps (google-genai / openai / anthropic) are not
        # exercised by the tests and are intentionally skipped here.
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short
